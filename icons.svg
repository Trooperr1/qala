<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- AI / Robot Icon -->
  <symbol id="icon-ai" viewBox="0 0 64 64">
    <path fill="currentColor" d="M32 8c-2.2 0-4 1.8-4 4v4h-8c-2.2 0-4 1.8-4 4v28c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V20c0-2.2-1.8-4-4-4h-8v-4c0-2.2-1.8-4-4-4zm-8 16h4v4h-4v-4zm12 0h4v4h-4v-4zM20 36h24v4H20v-4z"/>
    <circle cx="32" cy="6" r="2" fill="currentColor"/>
    <rect x="10" y="28" width="6" height="2" rx="1" fill="currentColor"/>
    <rect x="48" y="28" width="6" height="2" rx="1" fill="currentColor"/>
  </symbol>

  <!-- Web Development / Code Icon -->
  <symbol id="icon-code" viewBox="0 0 64 64">
    <path fill="currentColor" d="M18 24l-10 8 10 8v-6h28v6l10-8-10-8v6H18v-6z"/>
    <path fill="currentColor" d="M20 16l-4 4 4 4M44 16l4 4-4 4"/>
    <line x1="28" y1="12" x2="36" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="8" y="10" width="48" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Social Media / Mobile Icon -->
  <symbol id="icon-mobile" viewBox="0 0 64 64">
    <rect x="16" y="4" width="32" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="22" y1="10" x2="42" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="20" y="14" width="24" height="38" rx="2" fill="currentColor" opacity="0.2"/>
    <circle cx="32" cy="56" r="2" fill="currentColor"/>
  </symbol>

  <!-- Lightning / Speed Icon -->
  <symbol id="icon-lightning" viewBox="0 0 64 64">
    <path fill="currentColor" d="M35 4l-18 28h14l-6 28 24-32H35l8-24z"/>
  </symbol>

  <!-- Target / Results Icon -->
  <symbol id="icon-target" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="32" cy="32" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="32" cy="32" r="4" fill="currentColor"/>
  </symbol>

  <!-- Shield / Security Icon -->
  <symbol id="icon-shield" viewBox="0 0 64 64">
    <path fill="currentColor" d="M32 4L10 14v16c0 13.6 9.4 26.4 22 30 12.6-3.6 22-16.4 22-30V14L32 4zm0 8l16 8v10c0 10.8-7.4 21-16 24-8.6-3-16-13.2-16-24V20l16-8z"/>
    <path fill="currentColor" opacity="0.4" d="M28 28l-4 4 8 8 12-12-4-4-8 8-4-4z"/>
  </symbol>

  <!-- Hamburger Menu Icon -->
  <symbol id="icon-menu" viewBox="0 0 24 24">
    <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Close / X Icon -->
  <symbol id="icon-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Star Icon (for ratings) -->
  <symbol id="icon-star" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
  </symbol>

  <!-- Money / Pricing Icon -->
  <symbol id="icon-money" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3"/>
    <path fill="currentColor" d="M32 16v4m0 24v4m-6-22h8c2.2 0 4 1.8 4 4s-1.8 4-4 4h-8c-2.2 0-4 1.8-4 4s1.8 4 4 4h8"/>
  </symbol>

  <!-- Question / FAQ Icon -->
  <symbol id="icon-question" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
    <path fill="currentColor" d="M26 24c0-3.3 2.7-6 6-6s6 2.7 6 6c0 2.4-1.4 4.5-3.5 5.5-2.1 1-3.5 3.1-3.5 5.5v2h4v-2c0-1.1.6-2.1 1.5-2.6 3-1.5 5-4.6 5-8.4 0-5.5-4.5-10-10-10s-10 4.5-10 10h4zM30 44h4v4h-4z"/>
  </symbol>

  <!-- Email Icon -->
  <symbol id="icon-email" viewBox="0 0 64 64">
    <rect x="8" y="14" width="48" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <path fill="currentColor" d="M8 18l24 16 24-16" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>

  <!-- Phone Icon -->
  <symbol id="icon-phone" viewBox="0 0 64 64">
    <path fill="currentColor" d="M20 8c-2.2 0-4 1.8-4 4v6l8 8v-6c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v28c0 1.1-.9 2-2 2H26c-1.1 0-2-.9-2-2v-6l-8 8v6c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V12c0-2.2-1.8-4-4-4H20z"/>
  </symbol>

  <!-- Location / Map Pin Icon -->
  <symbol id="icon-location" viewBox="0 0 64 64">
    <path fill="currentColor" d="M32 8C22.6 8 15 15.6 15 25c0 11.2 17 29 17 29s17-17.8 17-29c0-9.4-7.6-17-17-17zm0 23c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6z"/>
  </symbol>

  <!-- Check / Checkmark Icon -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Arrow Right Icon -->
  <symbol id="icon-arrow-right" viewBox="0 0 24 24">
    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <polyline points="12 5 19 12 12 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
